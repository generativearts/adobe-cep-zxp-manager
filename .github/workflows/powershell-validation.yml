name: PowerShell validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path .\zxp_tools, .\tests -Filter '*.ps1' -File -Recurse
          $parseProblems = @()

          foreach ($file in $files) {
              $tokens = $null
              $fileErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$fileErrors
              )

              foreach ($parseError in $fileErrors) {
                  $parseProblems += '{0}:{1}: {2}' -f $file.Name, $parseError.Extent.StartLineNumber, $parseError.Message
              }
          }

          if ($parseProblems.Count -gt 0) {
              $parseProblems | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              throw "Found $($parseProblems.Count) PowerShell parser error(s)."
          }

          Write-Host "Parsed $($files.Count) PowerShell scripts successfully."

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Analyze PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -ErrorAction Stop
          $findings = @(Invoke-ScriptAnalyzer -Path .\zxp_tools -Recurse -Settings .\.PSScriptAnalyzerSettings.psd1)

          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize Path, Line, RuleName, Severity, Message | Out-String | Write-Host
              throw "PSScriptAnalyzer found $($findings.Count) violation(s)."
          }

          Write-Host "PSScriptAnalyzer found no violations."

      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery

      - name: Run Pester tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          $result = Invoke-Pester -Path .\tests -PassThru

          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }

          Write-Host "Pester passed $($result.PassedCount) test(s)."
